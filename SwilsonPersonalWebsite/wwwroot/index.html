<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swilson</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="SwilsonPersonalWebsite.styles.css" rel="stylesheet" />
    <style>
        .loading-screen {
            align-items: center;
            background: radial-gradient(ellipse at 50% 35%, #1c2b47 0, #101827 45%, #0b1120 100%);
            color: #f4f7fc;
            display: flex;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 1.5rem;
            position: relative;
            text-align: center;
        }

        .loading-card {
            align-items: center;
            display: flex;
            flex-direction: column;
            max-width: 28rem;
            position: relative;
            width: 100%;
            z-index: 1;
        }

        .loading-mark {
            align-items: center;
            background: linear-gradient(145deg, #72a8ff, #3977eb);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 1.1rem;
            box-shadow: 0 12px 38px rgba(37, 99, 235, 0.35);
            color: #fff;
            display: flex;
            font-size: 1.2rem;
            font-weight: 700;
            height: 4rem;
            justify-content: center;
            letter-spacing: -0.06em;
            margin-bottom: 2rem;
            width: 4rem;
        }

        .loading-eyebrow {
            color: #91b9ff;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.24em;
            margin: 0 0 0.8rem;
        }

        .loading-card h1 {
            color: #f4f7fc;
            font-size: clamp(1.7rem, 6vw, 2.25rem);
            font-weight: 600;
            letter-spacing: -0.045em;
            margin: 0;
        }

        .loading-caption {
            color: #aab6c9;
            font-size: 1rem;
            line-height: 1.6;
            margin: 0.8rem 0 2.4rem;
        }

        .loading-progress-track {
            background: rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            height: 0.3rem;
            overflow: hidden;
            width: min(100%, 16rem);
        }

        .loading-progress-track span {
            animation: loading-sweep 1.5s ease-in-out infinite;
            background: linear-gradient(90deg, #72a8ff, #c0d8ff);
            border-radius: inherit;
            display: block;
            height: 100%;
            width: 38%;
        }

        .loading-progress-meta {
            color: #8d9bb1;
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            margin-top: 0.9rem;
        }

        @keyframes loading-sweep {
            from { transform: translateX(-110%); }
            to { transform: translateX(280%); }
        }

        @media (prefers-reduced-motion: reduce) {
            .loading-progress-track span {
                animation: none;
                margin-left: 31%;
            }
        }
    </style>

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // https://github.com/rafrex/spa-github-pages
        // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
        // ----------------------------------------------------------------------
        // This script checks to see if a redirect is present in the query string
        // and converts it back into the correct url and adds it to the
        // browser's history using window.history.replaceState(...),
        // which won't cause the browser to attempt to load the new url.
        // When the single page app is loaded further down in this file,
        // the correct url will be waiting in the browser's history for
        // the single page app to route accordingly.
        (function (l) {
            if (l.search) {
                var q = {};
                l.search.slice(1).split('&').forEach(function (v) {
                    var a = v.split('=');
                    q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
                });
                if (q.p !== undefined) {
                    window.history.replaceState(null, null,
                        l.pathname.slice(0, -1) + (q.p || '') +
                        (q.q ? ('?' + q.q) : '') +
                        l.hash
                    );
                }
            }
        }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->

</head>

<body>
    <div id="app">
        <main class="loading-screen" role="status" aria-live="polite">
            <section class="loading-card" aria-label="Loading website">
                <div class="loading-mark" aria-hidden="true">SW</div>
                <p class="loading-eyebrow">SWILSON</p>
                <h1>Making things ready</h1>
                <p class="loading-caption">Your next stop is just around the corner.</p>
                <div class="loading-progress-track" aria-hidden="true">
                    <span></span>
                </div>
                <div class="loading-progress-meta">Loading website</div>
            </section>
        </main>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="decode.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                // For framework resources, use the precompressed .br files for faster downloads
                // This is needed only because GitHub pages doesn't natively support Brotli (or even gzip for .dll files)
                if (type !== 'dotnetjs' && location.hostname !== 'localhost') {
                    return (async function () {
                        const response = await fetch(defaultUri + '.br', { cache: 'no-cache' });
                        if (!response.ok) {
                            throw new Error(response.statusText);
                        }
                        const originalResponseBuffer = await response.arrayBuffer();
                        const originalResponseArray = new Int8Array(originalResponseBuffer);
                        const decompressedResponseArray = BrotliDecode(originalResponseArray);
                        const contentType = type === 'dotnetwasm' ? 'application/wasm' : 'application/octet-stream';
                        return new Response(decompressedResponseArray, { headers: { 'content-type': contentType } });
                    })();
                }
            }
        });
    </script>
</body>

</html>
